[package]
name = "quay-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "quay_app"
path = "src/lib.rs"

[[bin]]
name = "quay"
path = "src/main.rs"

[features]
default = ["embedded-frontend"]
embedded-frontend = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
tauri = "2.11.5"
quay-core.workspace = true
serde.workspace = true
serde_json.workspace = true
quay-forge.workspace = true
quay-store.workspace = true
quay-sync.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
