name: desktop system libraries
description: >
  Installs the system libraries the desktop shell links against on Linux.
  They are required because quay-app embeds a webview; without them the
  Rust jobs fail at link time rather than at compile time.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          librsvg2-dev \
          libayatana-appindicator3-dev \
          libxdo-dev \
          patchelf
